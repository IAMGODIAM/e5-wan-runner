name: modal-ltx-deploy
on:
  workflow_dispatch:
  repository_dispatch:
    types: [modal-ltx-deploy]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      WAN_GATE: ${{ secrets.WAN_GATE }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Modal
        run: pip install --quiet modal fastapi
      - name: Ensure Modal secrets exist (reuse wan family)
        run: |
          modal secret create r2-creds \
            R2_ACCOUNT_ID=fd98d813898e36431c9d6af3b0beeb20 \
            R2_BUCKET=e5-agora \
            R2_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" \
            R2_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" 2>/dev/null || echo "r2-creds exists"
          modal secret create wan-gate WAN_GATE="$WAN_GATE" 2>/dev/null || echo "wan-gate exists"
      - name: Deploy LTX lane to Modal
        run: |
          set -o pipefail
          modal deploy modal_ltx.py 2>&1 | tee modal_ltx_deploy.log
          grep -oiE 'https://[a-z0-9._-]*e5-ltx[a-z0-9._-]*\.modal\.run[a-z0-9._/-]*' modal_ltx_deploy.log | sort -u > modal_ltx_urls.txt
          cat modal_ltx_urls.txt
          [ -s modal_ltx_urls.txt ] || { echo "no modal URLs captured"; exit 1; }
      - name: Commit modal ltx urls
        run: |
          git config user.name "e5-runner"
          git config user.email "actions@e5enclave.com"
          git add modal_ltx_urls.txt modal_ltx_deploy.log 2>/dev/null || true
          git commit -m "record modal ltx urls" || echo "no change"
          git push || echo "push skipped"
      - name: Kick proof render + wait (cold run downloads ~71GB once)
        run: |
          set -o pipefail
          KICK=$(grep -i 'kick' modal_ltx_urls.txt | head -1)
          STAT=$(grep -i 'stat' modal_ltx_urls.txt | head -1)
          echo "kick: $KICK"; echo "stat: $STAT"
          [ -n "$KICK" ] && [ -n "$STAT" ] || { echo "endpoint URLs missing"; exit 1; }
          BODY=$(python3 -c "import json,os;print(json.dumps({'k':os.environ['WAN_GATE'],'prompt':'A majestic black dragon with gold-trimmed scales soars over a sunlit Miami skyline at golden hour, slow cinematic camera orbit, volumetric light, photoreal detail. Deep resonant wingbeats, wind rushing past the camera, a low orchestral swell with warm brass.','height':704,'width':1280,'num_frames':121,'seed':42,'fps':24,'out_key':'ltx/proof/ltx23_proof.mp4'}))")
          RESP=$(curl -s -m 120 -X POST "$KICK" -H "Content-Type: application/json" -d "$BODY")
          echo "kick raw: $(echo "$RESP" | head -c 300)"
          CID=$(echo "$RESP" | python3 -c "
          import sys,json
          try: print(json.load(sys.stdin).get('call_id',''))
          except Exception: print('')")
          echo "call_id=$CID"; [ -n "$CID" ] || { echo "no call_id"; exit 1; }
          for i in $(seq 1 480); do
            R=$(curl -s -m 60 "$STAT?call_id=$CID&k=$WAN_GATE")
            D=$(echo "$R" | python3 -c "
          import sys,json
          try: print(json.load(sys.stdin).get('done'))
          except Exception: print('parse-error')")
            echo "poll $i done=$D"
            if [ "$D" = "True" ]; then
              echo "$R" | head -c 2000; echo
              echo "$R" | python3 -c "import sys,json;d=json.load(sys.stdin);r=d.get('result') or {};sys.exit(0 if r.get('rc')==0 else 1)"
              exit $?
            fi
            sleep 10
          done
          echo "timed out"; exit 1
